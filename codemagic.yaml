
workflows:
  android-apk:
    name: Build Payment Helper APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract project
        script: |
          unzip -o PaymentHelper-Android-Project.zip -d extracted
          find extracted -name gradlew -type f
      - name: Build debug APK
        script: |
          cd extracted/PaymentHelper
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
