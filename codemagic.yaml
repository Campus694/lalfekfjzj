
workflows:
  android-apk:
    name: Build Payment Helper APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract project
        script: |
          set -eu
          mkdir -p extracted
          unzip -o PaymentHelper-Android-Project.zip -d extracted
          echo "Searching for Gradle wrapper..."
          find extracted -type f -name gradlew
      - name: Build debug APK
        script: |
          set -eu
          PROJECT_DIR="$(dirname "$(find extracted -type f -name gradlew | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found. Check ZIP structure and archive name."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
